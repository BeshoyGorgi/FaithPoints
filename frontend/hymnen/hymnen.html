<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Wichtig: Browser soll die Seite als hell behandeln -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1A3D64">

  <title>FaithPoints - Hymnen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../hymnen/hymnen.css" />
</head>
<body>
  <nav class="navbar">
  <img src="../images/logo.jpeg" alt="Logo" class="header-logo">

  <div class="seiten-mitte">
  <div class="seiten-titel">Hymnen-Übersicht</div>

      <a 
        href="https://drive.google.com/drive/mobile/folders/1NcxgUiVIq-2qAHno5em2MMLYq6jEkhIO?usp=sharing_eil&ts=69777dd6" 
        class="drive-link" 
        target="_blank" 
        rel="noopener noreferrer"
        aria-label="Google Drive öffnen"
        title="Google Drive öffnen"
      >
        <i class="bi bi-file-earmark-text"></i>
      </a>
    </div>

  <button id="zurueckButton" class="back-button">Zurück</button>
</nav>

  <main class="wrapper">
    <div class="top-row">
        
</div>

  <h1 class="hymnen-titel">Hymnen</h1>

<section class="toolbar-card">
  <div class="toolbar-head">
    <div>
      <h2 class="toolbar-title">Hymnen Filtern</h2>
    </div>

    <a href="/lehrplan/lehrplan.html" class="toolbar-link">Lehrplan</a>
  </div>

  <div class="toolbar-grid">
    <div class="toolbar-field toolbar-field--wide">
      <label for="kindSuche" class="toolbar-label">Kind</label>
      <input
        type="text"
        id="kindSuche"
        class="toolbar-input"
        placeholder="Nach einem Kind suchen..."
      />
    </div>

    <div class="toolbar-field">
      <label for="monatSuche" class="toolbar-label">Monat / Jahr</label>
      <input type="month" id="monatSuche" class="toolbar-input" />
    </div>

    <div class="toolbar-actions">
      <button id="monatSucheButton" class="toolbar-button primary" type="button">
        Suchen
      </button>

      <button id="monatScreenshotButton" class="toolbar-button success" type="button">
        Screenshot
      </button>

      <button id="monatResetButton" class="toolbar-reset" type="button">
        Zurücksetzen
      </button>
    </div>
  </div>

  <div id="monatInfo" class="toolbar-info"></div>
</section>

    <section id="kinderListe" class="kinder-liste"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="/hymnen/hymnen.js"></script>
</body>
</html>
