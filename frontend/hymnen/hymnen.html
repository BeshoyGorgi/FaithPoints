<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Wichtig: Browser soll die Seite als hell behandeln -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1A3D64">

  <title>FaithPoints - Hymnen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../hymnen/hymnen.css" />
</head>
<body>
  <nav class="navbar">
  <img src="../images/logo.jpeg" alt="Logo" class="header-logo">

  <div class="seiten-mitte">
  <div class="seiten-titel">Hymnen-Übersicht</div>

      <a 
        href="https://drive.google.com/drive/mobile/folders/1NcxgUiVIq-2qAHno5em2MMLYq6jEkhIO?usp=sharing_eil&ts=69777dd6" 
        class="drive-link" 
        target="_blank" 
        rel="noopener noreferrer"
        aria-label="Google Drive öffnen"
        title="Google Drive öffnen"
      >
        <i class="bi bi-file-earmark-text"></i>
      </a>
    </div>

  <button id="zurueckButton" class="back-button">Zurück</button>
</nav>

  <main class="wrapper">
    <div class="top-row">
        
</div>

  <h1 class="hymnen-titel">Hymnen</h1>

<section class="monat-filter-box">
  <label for="monatSuche" class="monat-filter-label">Datum suchen (Monat / Jahr)</label>

  <div class="monat-filter-row">
    <input type="month" id="monatSuche" class="monat-filter-input" />

    <button id="monatSucheButton" class="filter-button" type="button">
      Suchen
    </button>

    <button id="monatResetButton" class="filter-button secondary" type="button">
      Zurücksetzen
    </button>

    <button id="monatScreenshotButton" class="filter-button export" type="button">
      Screenshot herunterladen
    </button>
  </div>

  <div id="monatInfo" class="monat-info"></div>
</section>

<div class="search-row-hymnen">
  <input
    type="text"
    id="kindSuche"
    class="search-input-hymnen"
    placeholder="Nach einem Kind suchen..."
  />
</div>

<div class="lehrplan-bereich">
  <a href="/lehrplan/lehrplan.html" class="lehrplan-button">Lehrplan</a>
</div>

    <section id="kinderListe" class="kinder-liste"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="/hymnen/hymnen.js"></script>
</body>
</html>
