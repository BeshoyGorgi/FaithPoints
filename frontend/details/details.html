<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Wichtig: Browser soll die Seite als hell behandeln -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1A3D64">

  <title>FaithPoints - Details</title>
  <link rel="stylesheet" href="../details/details.css">
</head>
<body>
  <nav class="navbar">
    <img src="../images/logo.jpeg" alt="Logo" class="header-logo">
    <div class="seiten-titel">Kontakt-Übersicht</div>
    <button id="zurueckButton" class="back-button">Zurück</button>
  </nav>

  <main class="wrapper">
    <h1>Kontakte</h1>

    <input type="text" id="kinderSearch" placeholder="Nach Kind suchen...">

    <table id="kinderDetails">
      <thead>
        <tr>
          <th>Bild</th>
          <th>Name</th>
          <th>Klasse</th>
          <th>Eltern</th>
          <th>Telefon</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </main>

  <script type="module" src="/details/details.js"></script>
</body>
</html>
