<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Wichtig: Browser soll die Seite als hell behandeln -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1A3D64">

  <title>Platzierungen – Top 5</title>
  <link rel="stylesheet" href="../placements/placements.css">
</head>
<body>
  <nav class="navbar">
    <img src="../images/logo.jpeg" alt="Logo" class="header-logo">
    <div class="stufen-anzeige">
    <span class="title">Placements</span>

    <button class="icon-btn" id="placementsScreenshot"
            type="button"
            aria-label="Screenshot ohne Navbar"
            title="Screenshot ohne Navbar">
      <!-- Kamera-Icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 4l1.2-2h3.6L15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3z"></path>
        <path d="M12 17a4 4 0 1 0 0-8a4 4 0 0 0 0 8z"></path>
      </svg>
    </button>
   </div>

    <button class="back-button" id="backBtn">Zurück</button>
  </nav>

  <main class="wrapper">
    
    <!-- Podium (die 5 Podeste) -->
    <section class="podium-wrap" aria-label="Top 5 Podium">
      <div id="podium" class="podium"></div>
    </section>

    <!-- Bilder hinzufüegn: Bei den images -> placemants -> für jede einzelne Folder ->
      das erste bild mit 1.png dann mit 1.1.png und beim 2ten folder 2.png und dann 2.2.png und 2.3.png usw -->

  </main>

  <div class="confetti" aria-hidden="true"></div>

  <canvas id="confettiCanvas"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
  <script type="module" src="/placements/confetti.js"></script>

  <script type="module" src="/placements/placements.js"></script>
</body>
</html>
