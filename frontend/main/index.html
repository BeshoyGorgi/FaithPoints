<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaithPoints - Tabelle</title>
  <link rel="stylesheet" href="/main/style.css"/>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <img src="../images/logo.jpeg" alt="Logo" class="header-logo">
    <div class="stufen-anzeige" id="stufenAnzeige">Klassenübersicht</div>
    <button class="logout-button" id="logoutButton">Logout</button>
  </nav>

  <div class="wrapper">
    <h1>Punkteverteilung</h1>
      
    <!-- Augeen und Suchfunktion -->
    <div class="search-row">
      <!--Suchfunktion -->
  <input type="text" id="kinderSearch" placeholder="Nach Kind suchen...">

  <div class="icon-row">
    <!-- Auge -->
    <button id="toggleMarkierungen"
            class="mark-toggle"
            type="button"
            aria-label="Markierungen ausblenden"
            title="Markierungen ausblenden">
      <!-- Auge an -->
      <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <!-- Auge aus -->
      <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3l18 18"></path>
        <path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"></path>
        <path d="M9.5 5.5C10.3 5.2 11.1 5 12 5c6.5 0 10 7 10 7a18 18 0 0 1-4.2 5.1"></path>
        <path d="M6.2 6.2A18 18 0 0 0 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.2"></path>
      </svg>
    </button>

    <!-- NEU: Platzierungen -->
    <button id="goPlacements"
            class="mark-toggle"
            type="button"
            aria-label="Zu den Placements"
            title="Zu den Placements">
      <!-- Pokal Icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 4h8v2a4 4 0 0 1-4 4a4 4 0 0 1-4-4V4z"></path>
        <path d="M6 6H4a2 2 0 0 0 2 2"></path>
        <path d="M18 6h2a2 2 0 0 1-2 2"></path>
        <path d="M12 10v4"></path>
        <path d="M9 20h6"></path>
        <path d="M10 14h4"></path>
      </svg>
    </button>
  </div>
</div>


    
    <div class="table-container">
      <table id="meineTabelle">
        <thead>
          <tr>
            <th>Name<br>------<br>الاسم</th>
            <th>Hymne<br>------<br>الألحان</th>
            <th>Verhalten<br>------<br>السلوك</th>
            <th>Anwesenheit (G)<br>------<br>الحضور (القداس)</th>
            <th>Anwesenheit (U)<br>------<br>الحضور (الدروس)</th>
            <th>Gesamt<br>------<br>إجمالي</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamische Zeilen -->
        </tbody>
      </table>

      <!-- Plus-Button rechts unten -->
      <div id="addRow" class="plus-button">+</div>

      <!-- Minus-Button links unten -->
      <div id="removeColumn" class="minus-button">−</div>
    </div>

    <!-- Menü für Punkteänderungen -->
    <div id="punkteMenue" class="hidden">
      <button data-wert="20">+20</button>
      <button data-wert="-20">-20</button>
      <button data-wert="10">+10</button>
      <button data-wert="-10">-10</button>
      <button data-wert="5">+5</button>
      <button data-wert="-5">-5</button>
    </div>

    <button id="zuDetails" class="link-button">Zu den Kinder-Details</button>
    <button id="screenshot" class="screenshot-button"><img src="../images/screenshot.svg"></button>
  </div>

  <!-- Tooltip -->
  <div id="customTooltip" class="tooltip"></div>
  
  <script type="module" src="/main/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script> <!-- Screenshot -->
</body>
</html>
